[project]
name = "backline"
version = "0.1.0"
description = "Agent platform for music label operations — contracts, catalog, and royalty statements."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "tiktoken>=0.8",
    "anthropic>=0.120",
    "httpx>=0.27",
    "sqlglot>=27.29",
]

# The real embedding/rerank models (bge-small-en-v1.5 + ms-marco cross-encoder) run
# CPU-side via sentence-transformers — a heavy dependency (torch). It is optional so
# keyless CI and unit tests stay light; the Docker image and dev machines that build
# real embeddings install `--extra embed`. Offline environments use EMBED_MODEL=hash.
[project.optional-dependencies]
embed = ["sentence-transformers>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "types-pyyaml>=6.0",
    "types-reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backline", "datagen"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ui", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backline", "datagen", "scripts", "tests", "evals"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

# Optional heavy dependency (see [project.optional-dependencies].embed): imported
# lazily inside backline/rag; not installed in keyless CI.
[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `live` tests hit the real Anthropic API and cost money; they are excluded by default
# and run manually via `uv run pytest -m live` (BUILD_PLAN Phase 2 DoD). A later -m on
# the command line overrides this default.
addopts = '-m "not live"'
markers = [
    "live: hits the real Anthropic API (needs ANTHROPIC_API_KEY; run manually with -m live)",
]
