# Model registry: provider, context window, and USD list price per 1M tokens.
# The CostMeter prices every call from this table; the Phase 7 benchmark derives
# $/query from actual token usage × these numbers. Edit prices here, not in code.
#
# Prices are QUOTED STRINGS so they load as exact Decimals — money is never float
# (invariant 1); the registry rejects bare floats at load time.
#
# A model carries either flat usd_per_mtok_in/out or a dated `pricing` schedule:
# ordered tiers, each billing through its `through` date (inclusive, UTC), with
# exactly one open-ended final tier. The registry resolves the tier for the date
# it loads (tests pin `on=`), records the choice on the ModelInfo, and the eval
# runner prints it — a price transition happens on schedule and out loud, never
# by silently editing constants after the fact (D-017).
models:
  claude-opus-5:
    provider: anthropic
    context_window: 1000000
    usd_per_mtok_in: "5.00"
    usd_per_mtok_out: "25.00"
  claude-sonnet-5:
    provider: anthropic
    context_window: 1000000
    # Anthropic bills claude-sonnet-5 at launch-intro rates through 2026-08-31
    # (UTC), standing list price from 2026-09-01. Verified against the billing
    # dashboard for eval run 2b9f39fb (2026-08): metering at the flat 3/15
    # sticker overstated actual spend by exactly 1.5x ($16.74 vs ~$11.16).
    pricing:
      - through: "2026-08-31"
        usd_per_mtok_in: "2.00"
        usd_per_mtok_out: "10.00"
      - usd_per_mtok_in: "3.00"
        usd_per_mtok_out: "15.00"
  claude-haiku-4-5:
    provider: anthropic
    context_window: 200000
    usd_per_mtok_in: "1.00"
    usd_per_mtok_out: "5.00"

  # Local model via any OpenAI-format endpoint (vLLM on the 4090 rig, Phase 7).
  # Electricity is free at this scale; $/query for the local row is honest zero.
  local-qwen:
    provider: openai_compat
    context_window: 8192
    usd_per_mtok_in: "0"
    usd_per_mtok_out: "0"

  # Deterministic test models: MockProvider turns priced like their real-tier
  # counterparts so budget/cost tests exercise real arithmetic without a key.
  # Deliberately flat (no dated tiers): test costs must not move on a calendar day.
  mock-sonnet:
    provider: mock
    context_window: 200000
    usd_per_mtok_in: "3.00"
    usd_per_mtok_out: "15.00"
  mock-haiku:
    provider: mock
    context_window: 200000
    usd_per_mtok_in: "1.00"
    usd_per_mtok_out: "5.00"
