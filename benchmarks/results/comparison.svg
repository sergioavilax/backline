<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Scatter chart of model accuracy against cost per query">
  <title>Accuracy vs cost per query</title>
  <style>
    .surface { fill: #fcfcfb; }
    .ink-primary { fill: #0b0b0b; }
    .ink-secondary { fill: #52514e; }
    .ink-muted { fill: #898781; }
    .grid { stroke: #e1e0d9; }
    .axis { stroke: #c3c2b7; }
    .dot { fill: #2a78d6; stroke: #fcfcfb; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink-primary { fill: #ffffff; }
      .ink-secondary { fill: #c3c2b7; }
      .ink-muted { fill: #898781; }
      .grid { stroke: #2c2c2a; }
      .axis { stroke: #383835; }
      .dot { fill: #3987e5; stroke: #1a1a19; }
    }
  </style>
  <rect class="surface" x="0" y="0" width="720" height="440"/>
  <text class="ink-primary" x="24" y="34" font-size="15" font-weight="600">Accuracy vs cost per query</text>
  <text class="ink-muted" x="24" y="54" font-size="11">core suite · platform track · overall min-of-tiers score vs agent-loop $/query</text>
  <line class="axis" x1="64.0" y1="376.0" x2="684.0" y2="376.0" stroke-width="1"/>
  <text class="ink-muted" x="56.0" y="380.0" font-size="11" text-anchor="end" style="font-variant-numeric: tabular-nums">0</text>
  <line class="grid" x1="64.0" y1="303.0" x2="684.0" y2="303.0" stroke-width="1"/>
  <text class="ink-muted" x="56.0" y="307.0" font-size="11" text-anchor="end" style="font-variant-numeric: tabular-nums">25</text>
  <line class="grid" x1="64.0" y1="230.0" x2="684.0" y2="230.0" stroke-width="1"/>
  <text class="ink-muted" x="56.0" y="234.0" font-size="11" text-anchor="end" style="font-variant-numeric: tabular-nums">50</text>
  <line class="grid" x1="64.0" y1="157.0" x2="684.0" y2="157.0" stroke-width="1"/>
  <text class="ink-muted" x="56.0" y="161.0" font-size="11" text-anchor="end" style="font-variant-numeric: tabular-nums">75</text>
  <line class="grid" x1="64.0" y1="84.0" x2="684.0" y2="84.0" stroke-width="1"/>
  <text class="ink-muted" x="56.0" y="88.0" font-size="11" text-anchor="end" style="font-variant-numeric: tabular-nums">100</text>
  <text class="ink-muted" x="64.0" y="394.0" font-size="11" text-anchor="middle" style="font-variant-numeric: tabular-nums">$0.00</text>
  <line class="grid" x1="188.0" y1="84.0" x2="188.0" y2="376.0" stroke-width="1"/>
  <text class="ink-muted" x="188.0" y="394.0" font-size="11" text-anchor="middle" style="font-variant-numeric: tabular-nums">$0.10</text>
  <line class="grid" x1="312.0" y1="84.0" x2="312.0" y2="376.0" stroke-width="1"/>
  <text class="ink-muted" x="312.0" y="394.0" font-size="11" text-anchor="middle" style="font-variant-numeric: tabular-nums">$0.20</text>
  <line class="grid" x1="436.0" y1="84.0" x2="436.0" y2="376.0" stroke-width="1"/>
  <text class="ink-muted" x="436.0" y="394.0" font-size="11" text-anchor="middle" style="font-variant-numeric: tabular-nums">$0.30</text>
  <line class="grid" x1="560.0" y1="84.0" x2="560.0" y2="376.0" stroke-width="1"/>
  <text class="ink-muted" x="560.0" y="394.0" font-size="11" text-anchor="middle" style="font-variant-numeric: tabular-nums">$0.40</text>
  <line class="grid" x1="684.0" y1="84.0" x2="684.0" y2="376.0" stroke-width="1"/>
  <text class="ink-muted" x="684.0" y="394.0" font-size="11" text-anchor="middle" style="font-variant-numeric: tabular-nums">$0.50</text>
  <line class="axis" x1="64.0" y1="84.0" x2="64.0" y2="376.0" stroke-width="1"/>
  <text class="ink-muted" x="374.0" y="414.0" font-size="11" text-anchor="middle">cost per query (USD, agent loop)</text>
  <text class="ink-muted" x="20" y="230.0" font-size="11" text-anchor="middle" transform="rotate(-90 20 230.0)">overall score</text>
  <circle class="dot" cx="365.6" cy="108.3" r="5.5" stroke-width="2"/>
  <text class="ink-secondary" x="375.6" y="112.3" font-size="12" font-weight="600" text-anchor="start">claude-opus-5</text>
  <circle class="dot" cx="137.3" cy="108.5" r="5.5" stroke-width="2"/>
  <text class="ink-secondary" x="147.3" y="112.5" font-size="12" font-weight="600" text-anchor="start">claude-sonnet-5</text>
  <circle class="dot" cx="83.1" cy="134.5" r="5.5" stroke-width="2"/>
  <text class="ink-secondary" x="93.1" y="138.5" font-size="12" font-weight="600" text-anchor="start">claude-haiku-4-5</text>
</svg>
