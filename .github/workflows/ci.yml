name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type:
    name: python lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: pytest (postgres service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: backline
          POSTGRES_PASSWORD: backline
          POSTGRES_DB: backline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backline -d backline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://backline:backline@localhost:5432/backline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -v
      # royaltycalc is the most load-bearing module in the repo; Phase 1's DoD pins
      # its branch coverage at >= 95% (it ships at 100%).
      - name: royaltycalc branch-coverage gate
        run: >-
          uv run pytest tests/royaltycalc -q --cov=backline.royaltycalc
          --cov-branch --cov-fail-under=95
      # Suite-drift gate: regenerating the committed question suite must reproduce
      # it byte-for-byte (same discipline as the world fingerprint).
      - name: eval suite drift check
        run: uv run python -m evals generate --check
      # §5.4: keyless MockProvider end-to-end plumbing test on every PR — the whole
      # harness (agents, tools, scorers, runner, gate) against the committed mock
      # baseline, no API key involved.
      - name: eval-smoke (keyless, gated vs committed baseline)
        run: make eval-smoke

  ui:
    name: ui lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  # Phase 6 DoD: Playwright smoke — boot the keyless demo stack (seeded world,
  # API in demo mode, built UI) and drive chat → reconcile → approve a batch.
  e2e-smoke:
    name: playwright smoke (keyless demo stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: backline
          POSTGRES_PASSWORD: backline
          POSTGRES_DB: backline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backline -d backline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://backline:backline@localhost:5432/backline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: uv sync --frozen
      - name: Seed world + chunk corpus (hash embedder — keyless)
        run: |
          uv run python -m backline.db.migrate
          uv run python -m datagen seed
          EMBED_MODEL=hash uv run python -m backline.rag.embed
      - name: Start API (demo mode — no provider configured)
        run: |
          nohup uv run uvicorn backline.api.main:app --port 8000 > /tmp/api.log 2>&1 &
          timeout 30 bash -c 'until curl -sf localhost:8000/readyz; do sleep 1; done'
      - name: Build + start UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start > /tmp/ui.log 2>&1 &
          timeout 30 bash -c 'until curl -sf localhost:3000/chat > /dev/null; do sleep 1; done'
      - name: Install Playwright chromium
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Run smoke
        working-directory: ui
        run: pnpm exec playwright test
      - name: Server logs on failure
        if: failure()
        run: |
          echo "── api ──"; tail -50 /tmp/api.log || true
          echo "── ui ──"; tail -50 /tmp/ui.log || true
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: ui/test-results/
          if-no-files-found: ignore

  # §5.4: the live eval regression gate. Runs the budget-capped gate subset on the
  # planner-tier model and fails the job when any category drops >3 pts against
  # evals/results/baseline.json or any T2 violation appears (`evals gate`).
  # The secret check lives at step level (secrets aren't available in job-level
  # `if`), so forks and keyless PRs stay green. BUILD_PLAN names a self-hosted
  # runner for this job; until one is registered the GitHub-hosted runner does the
  # same work — flip `runs-on: [self-hosted]` when it exists.
  eval-regression:
    name: eval regression (live, secret-gated)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: backline
          POSTGRES_PASSWORD: backline
          POSTGRES_DB: backline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backline -d backline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://backline:backline@localhost:5432/backline
    steps:
      - name: Check for API key
        id: keycheck
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keycheck.outputs.have_key == 'true'
      - uses: astral-sh/setup-uv@v5
        if: steps.keycheck.outputs.have_key == 'true'
        with:
          enable-cache: true
      # CPU-wheel torch (D-011): the real embedding stack runs on the runner.
      - name: Install (with embed extra)
        if: steps.keycheck.outputs.have_key == 'true'
        run: uv sync --frozen --extra embed
      - name: Cache embedding models
        if: steps.keycheck.outputs.have_key == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-bge-small-msmarco
      - name: Seed world + build embeddings
        if: steps.keycheck.outputs.have_key == 'true'
        run: |
          uv run python -m datagen seed
          uv run python -m backline.rag.embed
      - name: Run gate subset + regression gate
        if: steps.keycheck.outputs.have_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          uv run python -m evals run --suite core --gate-subset
          --model claude-sonnet-5 --budget 5.00 --yes --gate
      - name: Upload eval artifacts
        if: steps.keycheck.outputs.have_key == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-regression-results
          path: data/evals/
          if-no-files-found: ignore
      - name: Skipped (no key)
        if: steps.keycheck.outputs.have_key == 'false'
        run: echo "No ANTHROPIC_API_KEY secret — live eval regression skipped (expected on forks)."
